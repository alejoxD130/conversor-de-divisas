<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      DivisApp 23002553
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-item>
    <ion-input 
      label="Cantidad en Quetzales (Q)" 
      labelPlacement="stacked" 
      type="number" 
      [(ngModel)]="quetzales" 
      (ionInput)="convertir()">
    </ion-input>
  </ion-item>

  <ion-card class="ion-margin-top">
    <ion-card-header>
      <ion-card-subtitle>Resultado de la conversión</ion-card-subtitle>
      <ion-card-title>{{ dolares | currency:'USD':'symbol':'1.2-2' }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Tasa de cambio fija: Q8.00 por $1.00
    </ion-card-content>
  </ion-card>
</ion-content>
